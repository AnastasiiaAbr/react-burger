services:
  stellar-burger:
    image: anastasiiaabr/reactburger:latest
    command: ["serve", "-s", "build", "-l", "80"]

  gateway:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - "/etc/letsencrypt/live/moonspeak.org/fullchain.pem:/etc/nginx/fullchain.pem:ro"
      - "/etc/letsencrypt/live/moonspeak.org/privkey.pem:/etc/nginx/privkey.pem:ro"
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
    command: nginx -g "daemon off; error_log stderr info;"
    depends_on:
      - app
